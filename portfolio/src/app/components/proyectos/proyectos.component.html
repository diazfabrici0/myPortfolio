<div class="relative text-4xl md:text-5xl font-light text-center pb-10 pt-10 text-white">
  <h1>PROYECTOS</h1>
</div>

<div class="flex flex-col items-center w-full">
  <!-- Contenedor animado -->
  <div class="flex flex-wrap justify-center gap-8 px-4 overflow-hidden transition-all duration-500 ease-in-out"
       [ngClass]="{
         'max-h-[520px] opacity-100': !mostrarTodos, 
         'max-h-[2000px] opacity-100': mostrarTodos
       }">
       
    <div *ngFor="let proyecto of proyectos"
         class="relative w-80 rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300">

      <!-- Imagen con overlay -->
      <div class="relative h-130">
        <img [src]="proyecto.imagen"
             alt="{{ proyecto.titulo }}"
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
      </div>

      <!-- Texto sobre la imagen -->
      <div class="absolute bottom-20 left-0 right-0 px-6 text-white">
        <h2 class="text-xl font-bold">{{ proyecto.titulo }}</h2>
        <p class="text-sm">{{ proyecto.descripcion }}</p>
      </div>

      <!-- Botón -->
      <div class="absolute bottom-5 left-6">
        <button (click)="abrirModal(proyecto)"
                class="bg-[#a1fdc4] text-black font-medium px-5 py-2 rounded-3xl shadow hover:scale-105 transition-transform duration-200">
          Ver proyecto
        </button>
      </div>
    </div>
  </div>

  <!-- Botón ver más en móvil -->
  <div class="text-center mt-4 lg:hidden" *ngIf="proyectos.length > 1">
    <button (click)="toggleMostrarTodos()"
            class="bg-[#a1fdc4] text-black font-medium px-5 py-2 rounded-3xl shadow hover:scale-105 transition-transform duration-200">
      {{ mostrarTodos ? 'Ver menos' : 'Ver más' }}
    </button>
  </div>
</div>


<!-- Modal de los proyectos -->
<div *ngIf="proyectoSeleccionado" 
     class="fixed inset-0 flex justify-center items-center z-50 text-white transition-opacity duration-300"
     [ngClass]="{'opacity-100': modalAbierto, 'opacity-0': !modalAbierto}">
  
  <!-- Fondo -->
  <div class="bg-black fixed inset-0 opacity-50 transition-opacity duration-300"></div>

  <!-- Contenido modal -->
  <div class="bg-[#03284b] p-6 rounded-xl shadow-xl max-w-3xl w-full relative flex gap-6 transform transition-opacity duration-300"
       [ngClass]="{'opacity-100': modalAbierto, 'opacity-0': !modalAbierto}">
       
    <!-- Botón cerrar -->
    <button (click)="cerrarModal()" class="absolute top-2 right-2 text-white hover:scale-110 transition">
      <fa-icon [icon]="faXmark"></fa-icon>
    </button>

    <!-- Imagen a la izquierda -->
    <img [src]="proyectoSeleccionado.imagen" alt="{{ proyectoSeleccionado.titulo }}" class="w-1/2 object-cover rounded">

    <!-- Texto + botón a la derecha -->
    <div class="flex flex-col w-1/2">
      <h2 class="text-2xl font-semibold">{{ proyectoSeleccionado.titulo }}</h2>
      <p class="mt-2">{{ proyectoSeleccionado.descripcion }}</p>
      <h3 class="mt-4 font-bold">Tecnologías:</h3>
      <ul class="list-disc list-inside pb-5">
        <li *ngFor="let tech of proyectoSeleccionado.tecnologias">{{ tech }}</li>
      </ul>
      <a href="{{ proyectoSeleccionado.link }}" target="_blank">
        <button class="bg-[#a1fdc4] text-black font-medium px-5 py-2 rounded-3xl shadow hover:scale-105 transition-transform duration-200 mt-auto">
          Ingresar
        </button>
      </a>
    </div>
  </div>
</div>
