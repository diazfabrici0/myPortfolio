<button 
  (click)="menuAbierto = !menuAbierto"
  class=" w-8 h-8 flex flex-col fixed top-6 left-4 gap-2 z-[9999] md:hidden">

  <span 
    class="block w-8 h-[3px] bg-white rounded transition-all duration-300"
    [ngClass]="menuAbierto ? 'rotate-45 translate-y-[5px]' : ''">
  </span>

  <span 
    class="block w-8 h-[3px] bg-white rounded transition-all duration-300"
    [ngClass]="menuAbierto ? '-rotate-45 -translate-y-[5px]' : ''">
  </span>
</button>
<div class="md:hidden fixed top-0 left-0 right-0 text-white font-light bg-[#14213d] z-20 w-full h-16 flex justify-end items-center px-4">
  <div class="flex items-center space-x-3">
    <h3>Fabricio Diaz</h3>
    <img src="assets/image/foto.jpg" alt="Foto Perfil" class="w-13 h-13 rounded-full object-cover">
  </div>

</div>
<div 
  class="fixed top-0 left-0 h-full w-64 bg-[#14213d] text-[#ffffff] flex flex-col justify-between shadow-xl/50
         transform transition-transform duration-300 ease-in-out z-40 md:translate-x-0"
  [ngClass]="{'-translate-x-full': !menuAbierto, 'translate-x-0': menuAbierto}">
  
  <div class="px-6 py-8 text-center">
    <img src="assets/image/foto.jpg" alt="Foto Perfil" class="w-35 h-35 rounded-full mx-auto mb-4 hidden md:block">
    </div>
      <nav class="flex-1  px-4 space-y-4 text-xl pl-10">
        <a [routerLink]="['/']" fragment="inicio" class="flex items-center space-x-2 hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200">
          <fa-icon [icon]="faHouse"></fa-icon>
          <span>Inicio</span>
        </a>

        <a [routerLink]="['/']" fragment="sobre-mi" class="flex items-center space-x-2 hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200">
          <fa-icon [icon]="faUser"></fa-icon>
          <span>Sobre mí</span>
        </a>
        
        <a [routerLink]="['/']" fragment="habilidades" class="flex items-center space-x-2 hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200">
          <fa-icon [icon]="faCode"></fa-icon>
          <span>Habilidades</span>
        </a>
        
        <a [routerLink]="['/']" fragment="proyectos" class="flex items-center space-x-2 hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200">
          <fa-icon [icon]="folder"></fa-icon>
          <span>Proyectos</span>
        </a>
        
        <a [routerLink]="['/']" fragment="contacto" class="flex items-center space-x-2 hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200">
          <fa-icon [icon]="faEnvelope"></fa-icon>
        <span>Contacto</span>
        </a>
      </nav>

      <div class="px-6 py-6 text-center">
        <button class="hover:scale-105 transition-transform duration-200">
          <a href="assets/documentos/curriculumFabricio.pdf" target="_blank" class="bg-[#a1fdc4] text-[#14213d] font-semibold px-4 py-2 rounded-full">Ver Curriculum</a>
        </button>
        <div class="flex justify-center space-x-4 mt-4 text-2xl">
          <a href="https://github.com/diazfabrici0" target="_blank" class="hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200"><fa-icon [icon]="faGithub"></fa-icon></a>
          <a href="https://www.linkedin.com/in/fabricio-diaz-077005321/" target="_blank" class="hover:text-[#a1fdc4] hover:scale-105 transition-transform duration-200"><fa-icon [icon]="faLinkedin"></fa-icon></a>
        </div>
      </div>
    </div>
