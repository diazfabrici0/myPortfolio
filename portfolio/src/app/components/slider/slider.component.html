<div class="relative text-4xl md:text-5xl font-light text-center pb-5 top-0">
  <h1>HABILIDADES</h1>
</div>

<div #sliderContainer class="relative w-full overflow-hidden pb-10 pt-5">
  <div class="flex transition-transform duration-500 ease-in-out"
       [ngStyle]="{ 'transform': 'translateX(-' + currentSlide * itemWidth + 'px)', 'width.px': images.length * itemWidth }">
    <div *ngFor="let image of images"
         class="flex justify-center items-center"
         [style.width.px]="itemWidth">
      <img [src]="image" alt="tecnología" class="w-[70px] sm:w-[100px] md:w-[150px] object-contain" />
    </div>
  </div>
</div>
